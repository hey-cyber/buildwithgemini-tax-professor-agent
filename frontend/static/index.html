<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Tax Studio — Professor Teena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --bg: #f5f4ef;
    --card-bg: #ffffff;
    --ink: #121212;
    --ink-muted: #555555;
    --border: 2px solid #121212;
    --border-dashed: 2px dashed #121212;
    --shadow: 4px 4px 0px #121212;
    --shadow-sm: 2px 2px 0px #121212;
    --font-mono: 'Space Mono', 'Courier New', monospace;
    --font-serif: 'Courier Prime', 'Georgia', serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 1.5rem;
    font-family: var(--font-serif);
    background-color: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background-image: radial-gradient(#121212 0.75px, transparent 0.75px);
    background-size: 16px 16px;
  }

  .bento-container {
    width: 100%;
    max-width: 1100px;
    display: grid;
    grid-template-columns: 320px 1fr;
    grid-template-rows: auto 1fr;
    gap: 1.25rem;
    height: calc(100vh - 3rem);
  }

  /* --- Bento Items --- */
  .bento-card {
    background: var(--card-bg);
    border: var(--border);
    box-shadow: var(--shadow);
    border-radius: 4px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header Bento */
  header.bento-header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 1.5rem;
    background: var(--card-bg);
    border: var(--border);
    box-shadow: var(--shadow);
  }

  .brand-title {
    font-family: var(--font-mono);
    font-size: 1.25rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .stamp-badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    font-size: 0.75rem;
    font-family: var(--font-mono);
    font-weight: 700;
    border: var(--border);
    background: #121212;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Sidebar Bento */
  .bento-sidebar {
    grid-column: 1;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    overflow-y: auto;
  }

  .syllabus-box {
    border: var(--border-dashed);
    padding: 1rem;
    background: #fafaf8;
  }

  .syllabus-title {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    border-bottom: var(--border);
    padding-bottom: 0.4rem;
    margin-bottom: 0.75rem;
  }

  .chip-btn {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--font-mono);
    font-size: 0.78rem;
    background: #ffffff;
    color: var(--ink);
    border: var(--border);
    padding: 0.5rem 0.75rem;
    margin-bottom: 0.5rem;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .chip-btn:hover {
    transform: translate(-1px, -1px);
    box-shadow: var(--shadow);
    background: #121212;
    color: #ffffff;
  }

  /* Chat Main Bento */
  .bento-chat {
    grid-column: 2;
    display: flex;
    flex-direction: column;
    padding: 0;
    height: 100%;
  }

  .chat-header {
    padding: 0.85rem 1.25rem;
    border-bottom: var(--border);
    background: #121212;
    color: #ffffff;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .msg {
    display: flex;
    flex-direction: column;
  }

  .msg.user {
    align-items: flex-end;
  }

  .msg.agent {
    align-items: flex-start;
  }

  .bubble {
    display: inline-block;
    padding: 0.85rem 1.1rem;
    border: var(--border);
    background: #ffffff;
    box-shadow: var(--shadow-sm);
    font-size: 0.95rem;
    line-height: 1.5;
    max-width: 88%;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: #121212;
    color: #ffffff;
    font-family: var(--font-mono);
    border-color: #121212;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    max-width: 100%;
    width: 100%;
    white-space: normal;
  }

  /* Form / Input area */
  form {
    display: flex;
    gap: 0.75rem;
    padding: 1rem 1.25rem;
    border-top: var(--border);
    background: #fafaf8;
  }

  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: var(--border);
    font-family: var(--font-serif);
    font-size: 0.95rem;
    background: #ffffff;
    outline: none;
  }

  input:focus {
    box-shadow: inset 0 0 0 1px #121212;
  }

  button {
    padding: 0.75rem 1.5rem;
    border: var(--border);
    background: #121212;
    color: #ffffff;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 0.85rem;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  button:hover {
    transform: translate(-1px, -1px);
    box-shadow: var(--shadow);
  }

  /* --- Retro A2UI Component Render Styles --- */
  .a2card {
    border: var(--border);
    background: #ffffff;
    padding: 1.25rem;
    box-shadow: var(--shadow);
    margin-bottom: 0.75rem;
    border-radius: 2px;
  }

  .a2col {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .a2row {
    display: flex;
    flex-direction: row;
    gap: 0.75rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .a2row.between {
    justify-content: space-between;
  }

  .a2text {
    margin: 0;
    line-height: 1.5;
    font-family: var(--font-serif);
  }

  .a2text.a2-h1 {
    font-family: var(--font-mono);
    font-size: 1.35rem;
    font-weight: 700;
    border-bottom: var(--border);
    padding-bottom: 0.4rem;
    margin-bottom: 0.4rem;
  }

  .a2text.a2-h2 {
    font-family: var(--font-mono);
    font-size: 1.15rem;
    font-weight: 700;
    text-transform: uppercase;
  }

  .a2text.a2-h3, .a2text.a2-h4 {
    font-family: var(--font-mono);
    font-size: 0.95rem;
    font-weight: 700;
    text-decoration: underline;
  }

  .a2text.a2-caption {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--ink-muted);
  }

  .a2divider {
    border: none;
    border-top: var(--border-dashed);
    margin: 0.75rem 0;
    width: 100%;
  }

  .a2img {
    max-width: 100%;
    border: var(--border);
    display: block;
    margin: 0.5rem 0;
  }

  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-size: 1.25rem;
    line-height: 1;
    vertical-align: middle;
    color: var(--ink);
  }

  @media (max-width: 820px) {
    .bento-container {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr;
      height: auto;
    }
    .bento-sidebar { grid-column: 1; }
    .bento-chat { grid-column: 1; height: 600px; }
  }
</style>
</head>
<body>

<div class="bento-container">
  <!-- Header Bento -->
  <header class="bento-header">
    <div class="brand-title">
      <span>🎓 Corporate Tax Studio</span>
    </div>
    <div class="stamp-badge">Professor Teena • CPA / EA</div>
  </header>

  <!-- Sidebar Bento -->
  <aside class="bento-sidebar">
    <div class="bento-card">
      <div class="syllabus-title">📜 Course Modules</div>
      <button class="chip-btn" onclick="sendPrompt('Explain Form 1065 partnership Schedule K-1 allocation rules')">📘 Form 1065: Partnerships</button>
      <button class="chip-btn" onclick="sendPrompt('Explain Form 1120-S AAA account ordering rules')">📗 Form 1120-S: S-Corps</button>
      <button class="chip-btn" onclick="sendPrompt('Explain Form 1120 Schedule M-1 book to tax reconciliation')">📙 Form 1120: C-Corps</button>
      <button class="chip-btn" onclick="sendPrompt('Show available tax case studies in Firestore database')">🗂️ Case Study Database</button>
    </div>

    <div class="bento-card syllabus-box">
      <div class="syllabus-title">📌 Reference Library</div>
      <div style="font-size:0.8rem; line-height:1.5;">
        • IRC §704(b) Special Allocations<br>
        • IRC §1368 AAA & Distribution Sourcing<br>
        • Schedule M-1 & M-3 Bridge<br>
        • Form 1065 / 1120 / 1120-S Grounded Docs
      </div>
    </div>
  </aside>

  <!-- Chat Bento -->
  <main class="bento-card bento-chat">
    <div class="chat-header">
      <span>TAX-PROFESSOR-AGENT // A2A INTERFACE</span>
      <span>STATUS: ONLINE</span>
    </div>

    <div id="log"></div>

    <form id="form">
      <input id="input" placeholder="Ask Professor Teena about Forms 1065, 1120, 1120-S, or case studies..." autocomplete="off" autofocus>
      <button type="submit">Send ↵</button>
    </form>
  </main>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(promptText) {
  input.value = promptText;
  form.dispatchEvent(new Event('submit', { cancelable: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
